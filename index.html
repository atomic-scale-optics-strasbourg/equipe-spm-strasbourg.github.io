<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>STM team Strasbourg</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="relay-page">

    <!-- HEADER -->

    <header class="relay-header">

      <div class="header-title">

    </header>


    <!-- PERMANENT RESEARCHERS -->

    <section class="permanent-staff">

      <p class="staff-title">Permanent researchers</p>

      <p class="staff-names">
        Katharina Kaiser
        <span>·</span>
        Laurent Limot
        <span>·</span>
        Guillaume Schull
        <span>·</span>
        Fabrice Scheurer
        <span>·</span>
        Song Jiang
      </p>

    </section>


    <!-- SUBTEAMS -->

    <section class="subteams">

      <!-- ATOMIC-SCALE OPTICS -->

      <a
        class="subteam"
        href="https://atomic-scale-optics-strasbourg.github.io/"
      >

        <div class="subteam-image">
          <img
            src="toc.png"
            alt="Atomic-scale Optics"
          >
        </div>

        <h2>Atomic-scale Optics</h2>

      </a>


      <!-- ATOMIC-SCALE MAGNETISM -->

      <a
        class="subteam"
        href="#"

        <div class="subteam-image">

            src="spin.png"
