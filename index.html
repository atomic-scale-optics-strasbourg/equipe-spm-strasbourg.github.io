<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SPM team Strasbourg</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="relay-page">

    <!-- HEADER -->

    <header class="relay-header">

      <div class="header-title">

        <div>
          <p class="eyebrow">Scanning Probe Microscopy</p>
          <h1>SPM team Strasbourg</h1>
        </div>

        <img
          class="team-logo"
          src="logo.png"
          alt="SPM team Strasbourg logo"
        >

      </div>

    </header>


    <!-- SUBTEAMS -->

    <section class="subteams">


      <!-- ATOMIC-SCALE OPTICS -->

      <a
        class="subteam"
        href="https://atomic-scale-optics-strasbourg.github.io/"
      >

        <div class="subteam-image">
          <img
            src="toc.png"
            alt="Atomic-scale Optics"
          >
        </div>

        <div class="subteam-label">

          <h2>Atomic-scale Optics</h2>

          <div class="keywords">
            <span>STM</span>
            <span>STML</span>
            <span>Light–matter interactions</span>
            <span>Ultrafast spectroscopy</span>
          </div>

        </div>

      </a>


      <!-- ATOMIC-SCALE MAGNETISM -->

      <a
        class="subteam"
        href="#"
      >

        <div class="subteam-image">
          <img
            src="spin.png"
            alt="Atomic-scale Magnetism"
          >
        </div>

        <div class="subteam-label">

          <h2>Atomic-scale Magnetism</h2>

          <div class="keywords">
            <span>SPM</span>
            <span>Spin</span>
            <span>Magnetism</span>
            <span>Atomic-scale control</span>
          </div>

        </div>

      </a>


    </section>


    <!-- PERMANENT RESEARCHERS -->

    <section class="permanent-staff">

      <p class="staff-title">Permanent researchers</p>

      <p class="staff-names">
        Katharina Kaiser
        <span>·</span>
        Laurent Limot
        <span>·</span>
        Fabrice Scheurer
        <span>·</span>
        Song Jiang
      </p>

    </section>


  </main>

</body>
</html>
